version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: voice_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voice_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: voice_redis
    ports:
      - "6379:6379"

  backend-api:
    build: ./backend
    container_name: voice_backend_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/voice_platform
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  backend-worker:
    build: ./backend
    container_name: voice_backend_worker
    command: python worker.py
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/voice_platform
      - REDIS_URL=redis://redis:6379/0
      - VAPI_API_KEY=${VAPI_API_KEY:-your_vapi_api_key_here}
      - VAPI_PHONE_NUMBER_ID=${VAPI_PHONE_NUMBER_ID:-your_phone_number_id_here}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: voice_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend-api

volumes:
  pgdata:
